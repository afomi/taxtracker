<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="tt-title tt-desc">
  <title id="tt-title">TaxTracker</title>
  <desc id="tt-desc">A descending flow graph — value traces down and outward from origination through collection to expenditure</desc>

  <!-- Descending trace paths (connected graph, not floating shapes) -->
  <path
    d="M10 14 L20 20 M20 20 L13 32 M20 20 L33 32"
    fill="none"
    stroke="#018DA8"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Origination -->
  <circle cx="10" cy="10" r="4.5" fill="#146486"/>

  <!-- Collection hub -->
  <circle cx="20" cy="20" r="5.5" fill="#018DA8"/>
  <circle cx="20" cy="20" r="2" fill="#146486"/>

  <!-- Expenditure destinations -->
  <circle cx="13" cy="34" r="4" fill="#4C5D89"/>
  <circle cx="33" cy="34" r="4" fill="#9D7B7E"/>
</svg>