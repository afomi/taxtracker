<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" role="img" aria-labelledby="ttl-title ttl-desc">
  <title id="ttl-title">TaxTracker</title>
  <desc id="ttl-desc">TaxTracker logo — descending flow graph mark with wordmark</desc>

  <!-- Mark -->
  <path
    d="M10 14 L20 20 M20 20 L13 32 M20 20 L33 32"
    fill="none"
    stroke="#018DA8"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="10" cy="10" r="4.5" fill="#146486"/>
  <circle cx="20" cy="20" r="5.5" fill="#018DA8"/>
  <circle cx="20" cy="20" r="2" fill="#146486"/>
  <circle cx="13" cy="34" r="4" fill="#4C5D89"/>
  <circle cx="33" cy="34" r="4" fill="#9D7B7E"/>

  <!-- Wordmark -->
  <text
    x="58"
    y="32"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="22"
    font-weight="600"
    letter-spacing="-0.03em"
  >
    <tspan fill="#06232F">Tax</tspan><tspan fill="#018DA8">Tracker</tspan>
  </text>
</svg>